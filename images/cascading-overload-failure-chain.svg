<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker></defs>
<rect width="960" height="700" fill="#ffffff"/>
<text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">How a Partial Failure Cascades, and Where to Break the Chain</text>
<text x="300" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3261e">Cascade</text>
<text x="760" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b6e3a">Defense that breaks this link</text>
<rect x="150" y="78" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1. Capacity drops</text>
<text x="300" y="120" text-anchor="middle" font-size="12" fill="#555">20% of servers fail; load moves to the rest</text>
<rect x="580" y="84" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="111" text-anchor="middle" font-size="12.5" fill="#1b6e3a">N+k headroom · cells · shuffle sharding</text>
<line x1="452" y1="106.0" x2="576" y2="106.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="136" x2="300" y2="159" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="162" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">2. Latency rises</text>
<text x="300" y="204" text-anchor="middle" font-size="12" fill="#555">Survivors jump from ~65% to ~81% utilization</text>
<rect x="580" y="168" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="195" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Admission control · adaptive concurrency limits</text>
<line x1="452" y1="190.0" x2="576" y2="190.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="220" x2="300" y2="243" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="246" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3. Timeouts trigger retries</text>
<text x="300" y="288" text-anchor="middle" font-size="12" fill="#555">Retry storm multiplies effective load</text>
<rect x="580" y="252" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="279" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Backoff + jitter · retry budgets · circuit breakers</text>
<line x1="452" y1="274.0" x2="576" y2="274.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="304" x2="300" y2="327" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="330" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">4. Core process overwhelmed</text>
<text x="300" y="372" text-anchor="middle" font-size="12" fill="#555">Threads, connections or queues exhausted</text>
<rect x="580" y="336" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="363" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Bulkheads · bounded queues · deadlines</text>
<line x1="452" y1="358.0" x2="576" y2="358.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="388" x2="300" y2="411" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="414" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="437" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">5. Healthy servers removed</text>
<text x="300" y="456" text-anchor="middle" font-size="12" fill="#555">Failed health checks shrink capacity further</text>
<rect x="580" y="420" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="447" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Readiness checks · min-healthy % (fail open)</text>
<line x1="452" y1="442.0" x2="576" y2="442.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="472" x2="300" y2="495" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="498" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="521" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">6. Failover spreads overload</text>
<text x="300" y="540" text-anchor="middle" font-size="12" fill="#555">Neighbor regions receive load they can't absorb</text>
<rect x="580" y="504" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="531" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Capacity-aware, gradual failover · region isolation</text>
<line x1="452" y1="526.0" x2="576" y2="526.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<line x1="300" y1="556" x2="300" y2="579" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="582" width="300" height="56" rx="8" fill="#fdecea" stroke="#d93025"/>
<text x="300" y="605" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">7. Recovery stalls</text>
<text x="300" y="624" text-anchor="middle" font-size="12" fill="#555">Returning servers are flooded by backlog</text>
<rect x="580" y="588" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#34a853"/>
<text x="760" y="615" text-anchor="middle" font-size="12.5" fill="#1b6e3a">Edge throttling · slow start · drop stale backlog</text>
<line x1="452" y1="610.0" x2="576" y2="610.0" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
<path d="M150,442.0 C 110,442.0 110,190.0 146,190.0" fill="none" stroke="#d93025" stroke-width="2" marker-end="url(#ahr)"/>
<text x="8" y="308.0" font-size="12" fill="#b3261e">Feedback loop:</text>
<text x="8" y="324.0" font-size="12" fill="#b3261e">fewer servers,</text>
<text x="8" y="340.0" font-size="12" fill="#b3261e">more load each</text>
<text x="480" y="680" text-anchor="middle" font-size="12" fill="#555">Change safety (staged rollouts, fast rollback) reduces the chance of step 1. Graceful degradation keeps core features alive throughout.</text>
</svg>