<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Email &amp; Collaboration Platform: Resilient Architecture</text>

  <!-- Clients -->
  <g font-size="13" text-anchor="middle" fill="#222">
    <rect x="60" y="55" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="145" y="85">Desktop mail app</text>
    <rect x="250" y="55" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="335" y="85">Mobile app</text>
    <rect x="440" y="55" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="525" y="85">Web client</text>
    <rect x="630" y="55" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="715" y="78">Internal callers</text>
    <text x="715" y="95" font-size="11" fill="#555">chat · search · AI assistant</text>
  </g>
  <g font-size="11" fill="#1b6e3a">
    <rect x="815" y="50" width="170" height="60" rx="6" fill="#e6f4ea" stroke="#34a853"/>
    <text x="900" y="68" text-anchor="middle">Backoff + jitter</text>
    <text x="900" y="83" text-anchor="middle">Retry budget (≤10%)</text>
    <text x="900" y="98" text-anchor="middle">Circuit breakers</text>
  </g>

  <line x1="430" y1="108" x2="430" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Global edge -->
  <rect x="60" y="152" width="740" height="56" rx="8" fill="#fff4e0" stroke="#e0a030"/>
  <text x="430" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Global Edge &amp; Traffic Router</text>
  <text x="430" y="196" text-anchor="middle" font-size="12" fill="#555">Rate limiting · Retry-After responses · capacity-aware, gradual failover between regions</text>

  <line x1="260" y1="210" x2="260" y2="246" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="740" y1="210" x2="740" y2="246" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M800,180 C 900,180 900,230 870,246" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="905" y="225" font-size="11" fill="#555">failover only if</text>
  <text x="905" y="239" font-size="11" fill="#555">headroom exists</text>

  <!-- Region template -->
  <g id="regionA">
    <rect x="30" y="250" width="460" height="400" rx="12" fill="#fafafa" stroke="#888" stroke-dasharray="6,4"/>
    <text x="45" y="272" font-size="14" font-weight="bold" fill="#333">Region A</text>

    <rect x="60" y="285" width="400" height="52" rx="8" fill="#eef1f5" stroke="#6b7a90"/>
    <text x="260" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Frontend tier (stateless)</text>
    <text x="260" y="325" text-anchor="middle" font-size="11" fill="#555">Admission control · priority load shedding · deadline propagation</text>

    <line x1="260" y1="339" x2="260" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="160" y="362" width="200" height="34" rx="8" fill="#eef1f5" stroke="#6b7a90"/>
    <text x="260" y="384" text-anchor="middle" font-size="12" fill="#222">Cell router (user → cell)</text>

    <line x1="200" y1="398" x2="115" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
    <line x1="260" y1="398" x2="260" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
    <line x1="320" y1="398" x2="405" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
  </g>

  <!-- Region A cells -->
  <g font-size="11" text-anchor="middle" fill="#222">
    <rect x="50" y="422" width="130" height="140" rx="8" fill="#ffffff" stroke="#4a76c9"/>
    <text x="115" y="440" font-weight="bold" font-size="12">Cell 1</text>
    <rect x="62" y="450" width="106" height="44" rx="5" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="115" y="468">Mailbox servers</text><text x="115" y="484">N + k</text>
    <rect x="62" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="115" y="518">Storage</text>
    <text x="115" y="548" fill="#555">Bulkheaded pools</text>

    <rect x="195" y="422" width="130" height="140" rx="8" fill="#fdecea" stroke="#d93025" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="260" y="440" font-weight="bold" font-size="12" fill="#b3261e">Cell 2</text>
    <rect x="207" y="450" width="106" height="44" rx="5" fill="#fbd3cf" stroke="#d93025"/>
    <text x="260" y="468">Mailbox servers</text><text x="260" y="484" fill="#b3261e" font-weight="bold">20% lost</text>
    <rect x="207" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="260" y="518">Storage</text>
    <text x="260" y="540" fill="#b3261e">Sheds low-priority</text>
    <text x="260" y="554" fill="#b3261e">work, degrades</text>

    <rect x="340" y="422" width="130" height="140" rx="8" fill="#ffffff" stroke="#4a76c9"/>
    <text x="405" y="440" font-weight="bold" font-size="12">Cell 3</text>
    <rect x="352" y="450" width="106" height="44" rx="5" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="405" y="468">Mailbox servers</text><text x="405" y="484">N + k</text>
    <rect x="352" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="405" y="518">Storage</text>
    <text x="405" y="548" fill="#555">Bulkheaded pools</text>
  </g>

  <rect x="50" y="575" width="420" height="62" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <g font-size="11" fill="#1b6e3a">
    <text x="62" y="593">Health checks: readiness ≠ liveness, min-healthy % (fail open)</text>
    <text x="62" y="610">Autoscaling: bounded, slow start for new or recovering servers</text>
    <text x="62" y="627">Control plane separated from data plane</text>
  </g>

  <!-- Region B -->
  <rect x="510" y="250" width="460" height="400" rx="12" fill="#fafafa" stroke="#888" stroke-dasharray="6,4"/>
  <text x="525" y="272" font-size="14" font-weight="bold" fill="#333">Region B (independent)</text>
  <rect x="540" y="285" width="400" height="52" rx="8" fill="#eef1f5" stroke="#6b7a90"/>
  <text x="740" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Frontend tier (stateless)</text>
  <text x="740" y="325" text-anchor="middle" font-size="11" fill="#555">Same defenses, no shared control plane with Region A</text>
  <line x1="740" y1="339" x2="740" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="640" y="362" width="200" height="34" rx="8" fill="#eef1f5" stroke="#6b7a90"/>
  <text x="740" y="384" text-anchor="middle" font-size="12" fill="#222">Cell router (user → cell)</text>
  <line x1="680" y1="398" x2="595" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="740" y1="398" x2="740" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="800" y1="398" x2="885" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
  <g font-size="11" text-anchor="middle" fill="#222">
    <rect x="530" y="422" width="130" height="140" rx="8" fill="#ffffff" stroke="#4a76c9"/>
    <text x="595" y="440" font-weight="bold" font-size="12">Cell 4</text>
    <rect x="542" y="450" width="106" height="44" rx="5" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="595" y="468">Mailbox servers</text><text x="595" y="484">N + k</text>
    <rect x="542" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="595" y="518">Storage</text>
    <rect x="675" y="422" width="130" height="140" rx="8" fill="#ffffff" stroke="#4a76c9"/>
    <text x="740" y="440" font-weight="bold" font-size="12">Cell 5</text>
    <rect x="687" y="450" width="106" height="44" rx="5" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="740" y="468">Mailbox servers</text><text x="740" y="484">N + k</text>
    <rect x="687" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="740" y="518">Storage</text>
    <rect x="820" y="422" width="130" height="140" rx="8" fill="#ffffff" stroke="#4a76c9"/>
    <text x="885" y="440" font-weight="bold" font-size="12">Cell 6</text>
    <rect x="832" y="450" width="106" height="44" rx="5" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="885" y="468">Mailbox servers</text><text x="885" y="484">N + k</text>
    <rect x="832" y="502" width="106" height="24" rx="5" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="885" y="518">Storage</text>
  </g>
  <rect x="530" y="575" width="420" height="62" rx="8" fill="#ffffff" stroke="#888"/>
  <text x="740" y="602" text-anchor="middle" font-size="12" fill="#333">Unaffected: Region A's failure stays inside Cell 2</text>
  <text x="740" y="620" text-anchor="middle" font-size="11" fill="#555">Accepts failover traffic only within its spare capacity</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <rect x="60" y="673" width="18" height="14" fill="#fdecea" stroke="#d93025"/>
    <text x="86" y="685">Failed / degraded cell</text>
    <rect x="260" y="673" width="18" height="14" fill="#e6f4ea" stroke="#34a853"/>
    <text x="286" y="685">Resilience controls</text>
    <rect x="450" y="673" width="18" height="14" fill="#e8f0fe" stroke="#4a76c9"/>
    <text x="476" y="685">Clients and servers</text>
    <rect x="640" y="673" width="18" height="14" fill="#f3e8fd" stroke="#8e5ac8"/>
    <text x="666" y="685">Storage</text>
  </g>
</svg>
